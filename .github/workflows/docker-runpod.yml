name: Build RunPod image

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-runpod-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ye0l/animaloratoolkit-kr-description

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build local smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: animalora-runpod:smoke
          cache-from: type=gha
          provenance: false
          sbom: false

      - name: Test startup, SSH, Web UI, and restart
        shell: bash
        run: |
          set -Eeuo pipefail

          key_file="$RUNNER_TEMP/runpod-smoke-key"
          ssh-keygen -q -t ed25519 -N '' -f "$key_file"

          cleanup() {
            docker logs runpod-smoke 2>/dev/null || true
            docker rm -f runpod-smoke 2>/dev/null || true
            rm -f "$key_file" "$key_file.pub"
          }
          trap cleanup EXIT

          docker run -d \
            --name runpod-smoke \
            -e AUTO_DOWNLOAD_MODELS=0 \
            -e SSH_ENABLED=1 \
            -e SSH_PUBLIC_KEY="$(cat "$key_file.pub")" \
            -e WEBUI_ENABLED=1 \
            -e WEBUI_USER=runpod \
            -e WEBUI_PASSWORD=smoke-test \
            -e JUPYTER_ENABLED=1 \
            -e JUPYTER_TOKEN=smoke-test \
            -p 12222:22 \
            -p 17860:7860 \
            -p 18888:8888 \
            animalora-runpod:smoke

          wait_for_services() {
            local web_ok=0
            local ssh_ok=0
            local jupyter_ok=0
            for _ in $(seq 1 80); do
              if curl --fail --silent --show-error \
                --user runpod:smoke-test \
                http://127.0.0.1:17860/upload >/dev/null; then
                web_ok=1
              fi
              if ssh -q \
                -i "$key_file" \
                -p 12222 \
                -o BatchMode=yes \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=2 \
                root@127.0.0.1 true; then
                ssh_ok=1
              fi
              if curl --fail --silent --show-error \
                http://127.0.0.1:18888/login >/dev/null; then
                jupyter_ok=1
              fi
              if [[ "$web_ok" == 1 && "$ssh_ok" == 1 && "$jupyter_ok" == 1 ]]; then
                return 0
              fi
              sleep 0.5
            done
            return 1
          }

          wait_for_services
          docker exec runpod-smoke python -m pip check
          docker exec runpod-smoke bash -n /opt/AnimaLoraToolkit/docker/entrypoint.sh
          docker exec runpod-smoke python /opt/AnimaLoraToolkit/docker/download_models_direct.py --self-test

          docker restart runpod-smoke >/dev/null
          wait_for_services

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
