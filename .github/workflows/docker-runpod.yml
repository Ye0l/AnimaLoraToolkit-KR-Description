name: Build RunPod image

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-runpod-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build local smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: animalora-runpod:smoke
          cache-from: type=gha
          provenance: false
          sbom: false

      - name: Test startup and restart
        shell: bash
        run: |
          set -Eeuo pipefail

          cleanup() {
            docker logs runpod-smoke 2>/dev/null || true
            docker rm -f runpod-smoke 2>/dev/null || true
          }
          trap cleanup EXIT

          docker run -d \
            --name runpod-smoke \
            -e AUTO_DOWNLOAD_MODELS=0 \
            -e SSH_ENABLED=0 \
            -e WEBUI_ENABLED=1 \
            -e WEBUI_USER=runpod \
            -e WEBUI_PASSWORD=smoke-test \
            -p 17860:7860 \
            animalora-runpod:smoke

          wait_for_upload_ui() {
            for _ in $(seq 1 60); do
              if curl --fail --silent --show-error \
                --user runpod:smoke-test \
                http://127.0.0.1:17860/upload >/dev/null; then
                return 0
              fi
              sleep 0.5
            done
            return 1
          }

          wait_for_upload_ui
          docker exec runpod-smoke python -m pip check
          docker exec runpod-smoke bash -n /opt/AnimaLoraToolkit/docker/entrypoint.sh
          docker exec runpod-smoke python /opt/AnimaLoraToolkit/docker/download_models.py --self-test

          docker restart runpod-smoke >/dev/null
          wait_for_upload_ui

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
